info:
  name: login-wrong-password
  type: http
  seq: 3

http:
  method: POST
  url: '{{BASE_URL}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{USER_EMAIL}}",
        "password": "definitely-not-the-password",
        "rememberMe": false
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '401'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Nhánh `!passwordMatches` trong `UserLocalStrategy.validate` → `throw UnauthorizedException`.

  Dùng ở bài 02 §3: exception breakpoint dừng ngay chỗ ném, trước khi filter của Nest
  biến nó thành response 401.
