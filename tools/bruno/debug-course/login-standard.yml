info:
  name: login-standard
  type: http
  seq: 1

http:
  method: POST
  url: '{{BASE_URL}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{USER_EMAIL}}",
        "password": "{{PASSWORD}}",
        "rememberMe": false
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `persistence = 'standard'` → `refreshTokenTtlMs = 86400000` (`session.refreshTtl` = 1d).

  Dùng ở bài 01, và bài 02 §1 (conditional breakpoint **không** dừng), §2, §5, §6.
