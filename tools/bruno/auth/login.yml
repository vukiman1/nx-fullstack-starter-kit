info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: '{{BASE_URL}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{USER_EMAIL}}",
        "password": "{{PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
