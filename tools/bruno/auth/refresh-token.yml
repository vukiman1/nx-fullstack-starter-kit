info:
  name: refresh-token
  type: http
  seq: 3

http:
  method: POST
  url: '{{BASE_URL}}/api/auth/refresh-token'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Đọc cookie `sub` do `login` set (Bruno tự giữ cookie jar) → `SessionService.rotateSession`
  cấp lại cặp token mới trên cùng session.
