info:
  name: Credit
  type: http
  seq: 2

http:
  method: GET
  url: '{{BASE_URL}}/api/user/credit'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
    - expression: res.body.success
      operator: eq
      value: 'true'
    - expression: res.body.data.balance
      operator: isNumber
    - expression: res.body.data.token
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `GET /api/user/credit` → `{ statusCode, success, data: { balance, token } }`.

  **Phải login trước.** `UserController` gắn `AuthGuard(StrategyKey.JWT.USER)`, và
  `JwtUserStrategy` lấy token từ **cookie `access_token`** chứ không phải header
  `Authorization` — nên chỉ cần chạy `auth/login` một lần, cookie jar của Bruno tự gắn
  cho request này.

  Chưa login / access token hết hạn hoặc đã bị revoke trong Redis → 401
  `{ statusCode: 401, success: false, errors: { message: 'Unauthorized' } }`.
